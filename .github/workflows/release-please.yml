name: Release
# release-please maintains a release PR from conventional commits; merging it
# tags the release. The build job installs, tests and packs the tag without
# any publish rights; the publish job holds the OIDC id-token, runs no
# project or dependency code, and ships the tested tarball to npm via trusted
# publishing (no token, no OTP; the trusted publisher on npmjs.com points at
# this workflow file).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description:
          Existing release tag to retry publishing (for example v0.2.1)
        required: true
        type: string
      dry_run:
        description:
          Check the OIDC token exchange with npm publish --dry-run; upload
          nothing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    # Forks skip this job: release PRs belong to the upstream repository only.
    if:
      ${{ github.event_name == 'push' && github.repository ==
      'Fanzzzd/convex-improved-migration' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: release-please-config.json and
      # .release-please-manifest.json hold the release type and the current
      # version, so the first run after 0.1.0 does not depend on tag order.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  build:
    needs: release-please
    if:
      ${{ always() && (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG:
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify immutable release version
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          # shellcheck disable=SC2016 # the backticks are a JS template literal
          node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`)'

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build:clean
          npm run verify:package

      - name: Gate on tests
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Pack
        run: |
          mkdir pack
          npm pack --ignore-scripts --pack-destination pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC for npm trusted publishing
    env:
      RELEASE_TAG:
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.release-please.outputs.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      # No checkout and no install: this job runs only Node, npm and the
      # tarball the build job tested. No registry-url on purpose: trusted
      # publishing authenticates via OIDC, and setup-node's token-templated
      # .npmrc would only add an empty-auth ambiguity.
      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: pack

      - name: Verify tarball version
        run: |
          set -euo pipefail
          # The ./ prefix matters: npm reads "pack/x.tgz" as a GitHub
          # shorthand, not a file.
          test "$(find ./pack -name '*.tgz' | wc -l)" -eq 1
          TARBALL="$(find ./pack -name '*.tgz')"
          VERSION="$(tar -xzOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          test "v$VERSION" = "$RELEASE_TAG"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm publish --provenance --ignore-scripts "$TARBALL"

      # --force only skips the "already published" check, so a dry run works
      # on a released tag. The OIDC exchange runs before the dry-run stop.
      - name: Check trusted publishing (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          set -euo pipefail
          npm publish --dry-run --force --provenance --ignore-scripts --loglevel verbose "$TARBALL" 2>&1 | tee publish.log
          grep -q "Successfully retrieved and set token" publish.log
