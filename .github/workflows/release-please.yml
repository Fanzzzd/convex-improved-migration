name: Release
# release-please maintains a release PR from conventional commits; merging it
# tags the release, and the publish job ships to npm via OIDC trusted
# publishing (no token, no OTP; configure the trusted publisher on npmjs.com
# to point at this workflow file).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description:
          Existing release tag to retry publishing (for example v0.2.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    # Forks skip this job: release PRs belong to the upstream repository only.
    if:
      ${{ github.event_name == 'push' && github.repository ==
      'Fanzzzd/convex-improved-migration' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: release-please-config.json and
      # .release-please-manifest.json hold the release type and the current
      # version, so the first run after 0.1.0 does not depend on tag order.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release-please
    if:
      ${{ always() && (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    env:
      RELEASE_TAG:
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify immutable release version
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`)'

      # No registry-url on purpose: trusted publishing authenticates via
      # OIDC, and setup-node's token-templated .npmrc would only add an
      # empty-auth ambiguity.
      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build:clean
          npm run verify:package

      - name: Gate on tests
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Publish to npm
        run: npm publish
